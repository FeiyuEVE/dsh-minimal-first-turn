name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The plugin ships plain JavaScript and declares no runtime dependencies
      # (dsh resolves every @deepseek-ai package at runtime), so there is no
      # install step and no lockfile to cache.
      - run: npm run check
      - run: npm pack --dry-run
